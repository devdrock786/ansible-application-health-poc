---
application_name: health-monitor
environment_name: development
application_root: /opt/health-monitor
disk_warning_threshold: 75
memory_warning_threshold: 1500

required_packages:
  - git
  - unzip

application_directories:
  - /opt/health-monitor
  - /opt/health-monitor/logs
  - /opt/health-monitor/config

application_users:
  - name: healthadmin
    group: monitoring
  - name: healthreader
    group: monitoring