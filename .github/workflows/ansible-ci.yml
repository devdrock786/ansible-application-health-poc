---
name: Ansible CI CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and linters
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install required collections
        run: |
          ansible-galaxy collection install ansible.posix
          ansible-galaxy collection install community.general

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run syntax check
        run: ansible-playbook --syntax-check playbook.yml -i inventory.ini

      - name: List all tasks
        run: ansible-playbook --list-tasks playbook.yml -i inventory.ini

      - name: List all tags
        run: ansible-playbook --list-tags playbook.yml -i inventory.ini

  check-mode:
    name: Dry run on AWS servers
    needs: lint
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify inventory
        run: ansible-inventory --graph

      - name: Test connectivity
        run: ansible aws -m ansible.builtin.ping

      - name: Run playbook in check mode
        run: ansible-playbook playbook.yml --check --diff
        continue-on-error: true

  deploy:
    name: Deploy to AWS servers
    needs: check-mode
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run playbook
        run: ansible-playbook playbook.yml

      - name: Verify idempotency
        run: ansible-playbook playbook.yml | tee idempotency-output.txt

      - name: Verify deployed files
        run: |
          ansible aws -b -m ansible.builtin.command \
            -a "cat /opt/health-monitor/health-report.txt"

      - name: Verify service state
        run: |
          ansible aws -b -m ansible.builtin.command \
            -a "ls -ld /opt/health-monitor /opt/health-monitor/logs"
