---
- name: Configure application environment on AWS servers
  hosts: aws
  become: true
  gather_facts: true

  vars:
    deployment_owner: devendra

  tasks:
    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "Application: {{ application_name }}"
          - "Environment: {{ environment_name }}"
          - "Owner: {{ deployment_owner }}"

    - name: Install required packages
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ required_packages }}"

    - name: Create application group
      ansible.builtin.group:
        name: monitoring
        state: present

    - name: Create application users
      ansible.builtin.user:
        name: "{{ item.name }}"
        group: "{{ item.group }}"
        state: present
        create_home: true
      loop: "{{ application_users }}"

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: healthadmin
        group: monitoring
        mode: "0750"
      loop: "{{ application_directories }}"

    - name: Check root disk usage
      ansible.builtin.command:
        cmd: df -P /
      register: disk_check_result
      changed_when: false

    - name: Extract disk usage percentage
      ansible.builtin.set_fact:
        disk_usage_percent: "{{ disk_check_result.stdout_lines[1].split()[4] | replace('%', '') | int }}"

    - name: Check configuration directory
      ansible.builtin.stat:
        path: /opt/health-monitor/config
      register: config_directory_result

    - name: Display collected values
      ansible.builtin.debug:
        msg:
          - "Disk usage: {{ disk_usage_percent }}"
          - "Disk threshold: {{ disk_warning_threshold }}"
          - "Memory MB: {{ ansible_memtotal_mb }}"
          - "Memory threshold: {{ memory_warning_threshold }}"
          - "Config directory exists: {{ config_directory_result.stat.exists }}"

    - name: Display disk warning
      ansible.builtin.debug:
        msg: "WARNING: Disk usage is {{ disk_usage_percent }}% on {{ inventory_hostname }}"
      when: disk_usage_percent | int >= disk_warning_threshold | int

    - name: Display disk healthy message
      ansible.builtin.debug:
        msg: "HEALTHY: Disk usage is {{ disk_usage_percent }}% on {{ inventory_hostname }}"
      when: disk_usage_percent | int < disk_warning_threshold | int

    - name: Display configuration directory found
      ansible.builtin.debug:
        msg: "SUCCESS: Configuration directory exists"
      when: config_directory_result.stat.exists

    - name: Display configuration directory missing
      ansible.builtin.debug:
        msg: "ERROR: Configuration directory does not exist"
      when: not config_directory_result.stat.exists

    - name: Display low memory warning
      ansible.builtin.debug:
        msg: "LOW MEMORY: Only {{ ansible_memtotal_mb }} MB available"
      when: ansible_memtotal_mb | int < memory_warning_threshold | int

    - name: Display critical resource warning
      ansible.builtin.debug:
        msg: "CRITICAL: Disk and memory both under pressure"
      when:
        - disk_usage_percent | int >= disk_warning_threshold | int
        - ansible_memtotal_mb | int < memory_warning_threshold | int

    - name: Display Amazon Linux confirmation
      ansible.builtin.debug:
        msg: "This server runs {{ ansible_distribution }} {{ ansible_distribution_version }}"
      when: ansible_distribution == "Amazon"

    - name: Deploy health report
      ansible.builtin.template:
        src: health-report.j2
        dest: /opt/health-monitor/health-report.txt
        owner: healthadmin
        group: monitoring
        mode: "0640"

    - name: Deploy monitoring configuration
      ansible.builtin.template:
        src: monitor.conf.j2
        dest: /opt/health-monitor/config/monitor.conf
        owner: healthadmin
        group: monitoring
        mode: "0640"
      notify: Reload monitoring configuration

  handlers:
    - name: Reload monitoring configuration
      ansible.builtin.debug:
        msg: "Configuration changed on {{ inventory_hostname }}."