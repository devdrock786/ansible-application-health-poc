---
- name: Configure application environment on AWS servers
  hosts: aws
  become: true
  gather_facts: true

  vars:
    deployment_owner: devendra

  tasks:
    - name: Display configuration summary
      ansible.builtin.debug:
        msg:
        - "Server: {{ inventory_hostname }}"
        - "Application: {{ application_name }}"
        - "Environment: {{ environment_name }}"
        - "Owner: {{ deployment_owner }}"

    - name: install required package
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ require_package }}"

    - name: create application groups
      ansible.builtin.group:
        name: monitoring
        state: present

    - name: Create application users
      ansible.builtin.user:
        name: "{{ item.name }}"
        group: "{{ item.group }}"
        state: present
        create_home: true
      loop: "{{ application_users }}"

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: healthadmin
        group: monitoring
        mode: "0750"
      loop: "{{ application_directory }}"

